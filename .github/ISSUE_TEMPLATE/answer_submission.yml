      required: true

  - type: textarea
    id: code-implementation
    attributes:
      label: 代码实现
      description: "请将你的函数或类的完整代码粘贴到这里。请不要包含题目的说明文字。"
      render: python
      placeholder: |
        def your_function_or_class():
            # 在这里粘贴你的代码
            pass
    validations:
      required: true

  - type: textarea
    id: explanation
    attributes:
      label: 思路讲解 (可选)
      description: 如果你愿意，可以在这里分享你的解题思路、遇到的困难或学到的新知识。
